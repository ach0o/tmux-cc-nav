<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="tmux 창은 터미널 안의 탭이고, 창마다 Claude Code를 하나씩 띄운다. 키는 Ctrl-b를 눌렀다 뗀 뒤 다음 키를 누른다.">
  <style>
    text { font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
    .mono { font-family: "SF Mono", Menlo, Consolas, monospace; }
  </style>
  <rect width="760" height="300" rx="12" fill="#ffffff"/>

  <!-- 1. 터미널 한 개 = tmux 세션, 아래 줄 = 창 목록 -->
  <text x="24" y="34" font-size="15" font-weight="700" fill="#1f2328">① 터미널 하나에 창(탭) 여러 개 — 창마다 Claude 하나</text>
  <rect x="24" y="48" width="470" height="170" rx="8" fill="#1e1e1e"/>
  <circle cx="42" cy="62" r="5" fill="#ff5f57"/><circle cx="58" cy="62" r="5" fill="#febc2e"/><circle cx="74" cy="62" r="5" fill="#28c840"/>
  <text x="40" y="96" class="mono" font-size="13" fill="#d4d4d4">&gt; 결제가 실패하면 3번까지 다시 시도하게 해줘</text>
  <text x="40" y="120" class="mono" font-size="13" fill="#9e9e9e">⏺ 재시도 간격은 1초, 2초, 4초로 늘어나게 했습니다.</text>
  <text x="40" y="150" class="mono" font-size="12" fill="#6e6e6e">지금 보이는 화면 = 1번 창의 Claude</text>
  <rect x="24" y="190" width="470" height="28" fill="#000000"/>
  <text x="34" y="209" class="mono" font-size="13" fill="#28c840">main</text>
  <rect x="78" y="194" width="104" height="20" rx="3" fill="#0969da"/>
  <text x="84" y="209" class="mono" font-size="13" fill="#ffffff">1:API-결제*</text>
  <text x="192" y="209" class="mono" font-size="13" fill="#d4d4d4">2:API-인증</text>
  <text x="292" y="209" class="mono" font-size="13" fill="#d4d4d4">3:WEB-대시보드</text>

  <!-- 상태 줄 설명 -->
  <path d="M130 218 v22" stroke="#0969da" stroke-width="1.5"/>
  <text x="38" y="256" font-size="12.5" fill="#0969da">* = 지금 보는 창</text>
  <path d="M235 218 v22" stroke="#57606a" stroke-width="1.5"/>
  <text x="168" y="256" font-size="12.5" fill="#57606a">번호:창 이름</text>
  <text x="38" y="282" font-size="12.5" fill="#57606a">창 이름을 <tspan class="mono" fill="#1f2328">그룹-이름</tspan> 꼴로 지으면 같은 그룹이 같은 색으로 묶임</text>

  <!-- 2. prefix 키 누르는 법 -->
  <text x="520" y="34" font-size="15" font-weight="700" fill="#1f2328">② prefix 키 누르는 법</text>
  <g class="mono" font-size="14">
    <rect x="520" y="56" width="64" height="34" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="532" y="78" fill="#1f2328">Ctrl</text>
    <text x="592" y="78" fill="#57606a">+</text>
    <rect x="606" y="56" width="34" height="34" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="618" y="78" fill="#1f2328">b</text>
  </g>
  <text x="652" y="78" font-size="13" fill="#57606a">동시에</text>
  <path d="M552 98 v24" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="566" y="116" font-size="13" fill="#57606a">손을 뗀 뒤</text>
  <rect x="520" y="130" width="34" height="34" rx="6" fill="#ddf4ff" stroke="#0969da"/>
  <text x="532" y="152" class="mono" font-size="14" fill="#0969da">w</text>
  <text x="566" y="152" font-size="13" fill="#1f2328">= 이 도구의 목록</text>
  <text x="520" y="194" font-size="12.5" fill="#57606a">문서의 <tspan class="mono" fill="#1f2328">prefix w</tspan>가 이 순서</text>
  <text x="520" y="214" font-size="12.5" fill="#57606a">prefix를 바꿨다면 그 키로</text>

  <defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 0 L5 10 z" fill="#57606a" transform="rotate(-90 5 5)"/></marker></defs>
</svg>
