# Claude Code 상태 표시 (tmux-cc-nav). ~/.tmux.conf 에서 source-file 로 불러옴
# Claude Code 상태 (@cc: run/wait/done, ~/.claude/settings.json hook이 설정)
set -g mode-style 'bg=colour238,fg=white'
set -g @cc_fmt '#{?#{==:#{@cc},run},#[fg=yellow]●#[default],#{?#{==:#{@cc},wait},#[fg=red]?#[default],#{?#{==:#{@cc},done},#[fg=green]✓#[default], }}}'
bind W run-shell "python3 ~/.tmux/cc-sync.py" \; choose-tree -Zw -F '#{?window_format,#[dim]#{?@cc_t,#{t/f/%m-%d %H%M:@cc_t},          }#[default] #{E:@cc_fmt} #{?#{automatic-rename},,#[bold fg=colour44][#[fg=#{?@cc_col,#{@cc_col},colour44}]#{?@cc_g,#{@cc_g},#{window_name}}#[fg=colour44]#{@cc_s}#[fg=colour255]#{@cc_r}#[fg=colour44]]#[default] }#[fg=colour250]#{s/^✳ //:pane_title}#[default],#{?pane_format,#{s/^✳ //:pane_title},#{session_windows} windows#{?session_attached, (attached),}}}'
# Claude 창을 최근 작업 순으로 고르기 (fzf)
bind w display-popup -E -w 90% -h 90% ~/.tmux/cc-pick.sh
# 창 이름 그룹 색 (@cc_col): 이름 바꿀 때와 설정 로드 때 다시 계산
# 자동 이름 변경(automatic-rename)일 땐 건너뜀, 바뀐 창 하나만 계산
set-hook -g window-renamed 'if -F "#{automatic-rename}" "" "run-shell -b \"~/.tmux/cc-color.sh #{window_id}\""'
run-shell -b ~/.tmux/cc-color.sh

# ── 선택: prefix를 누르면 입력기를 영문(ABC)으로 바꿈 (macOS, 한글 사용자용) ──
