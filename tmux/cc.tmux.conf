# tmux-cc-nav. ~/.tmux.conf 에서 source-file 로 불러옴.
# 설정을 바꾸려면 ~/.tmux.conf 에서 이 파일을 불러오기 "전에" set -g @ccnav-* 를 적음 (README의 설정 표).
# 아래 줄들은 사용자가 정하지 않은 옵션에만 기본값을 넣음.
set -gF @ccnav-key-popup     '#{?@ccnav-key-popup,#{@ccnav-key-popup},w}'
set -gF @ccnav-key-tree      '#{?@ccnav-key-tree,#{@ccnav-key-tree},W}'
set -gF @ccnav-popup-size    '#{?@ccnav-popup-size,#{@ccnav-popup-size},90%}'
set -gF @ccnav-preview       '#{?@ccnav-preview,#{@ccnav-preview},40%}'
set -gF @ccnav-color-bracket '#{?@ccnav-color-bracket,#{@ccnav-color-bracket},44}'
set -gF @ccnav-color-name    '#{?@ccnav-color-name,#{@ccnav-color-name},255}'
set -gF @ccnav-color-title   '#{?@ccnav-color-title,#{@ccnav-color-title},250}'
set -gF @ccnav-palette       '#{?@ccnav-palette,#{@ccnav-palette},39 214 141 114 211 221 81 180 203 156 177 223 208 209 105 150 167 75 186 135 202 217 99 227 69 173 120 213 33 179 85 147}'
set -gF @ccnav-mode-style    '#{?@ccnav-mode-style,#{@ccnav-mode-style},bg=colour238 fg=white}'
set -gF @ccnav-ime           '#{?@ccnav-ime,#{@ccnav-ime},off}'

# 키 바인딩, 선택 줄 색, 그룹 색 hook (옵션 값을 읽어야 해서 스크립트로)
run-shell ~/.tmux/cc-setup.sh
